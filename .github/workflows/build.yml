name: Production Build & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Verify Production Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Application & Server
        run: |
          npm run build
          npm run build:server

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "dist directory not found"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html not found"; exit 1; }
          test -d server-dist || { echo "server-dist directory not found"; exit 1; }
          test -f server-dist/server.cjs || { echo "server-dist/server.cjs not found"; exit 1; }
          echo "Production build verified successfully!"
