name: Production Build & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Verify Production Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Type Check & Lint
        run: bun run lint

      - name: Build Application & Server
        run: bun run build

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "dist directory not found"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html not found"; exit 1; }
          test -f dist/server.cjs || { echo "dist/server.cjs not found"; exit 1; }
          echo "Production build verified successfully!"
