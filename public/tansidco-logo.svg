<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="sidcoBg" cx="50%" cy="45%" r="55%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="sidcoGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Rim Gradient -->
    <linearGradient id="sidcoRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2e5a"/>
      <stop offset="100%" stop-color="#071933"/>
    </linearGradient>

    <!-- Top Text Path -->
    <path id="topTextArc" d="M 38,100 A 62,62 0 0,1 162,100" fill="none" />
  </defs>

  <!-- Outer Rounded Shield / Circle -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Outer Navy Rim -->
  <circle cx="100" cy="100" r="90" fill="url(#sidcoRim)" />

  <!-- Inner Light Blue Medallion -->
  <circle cx="100" cy="100" r="82" fill="url(#sidcoBg)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Top Arched Text: TAMILNADU -->
  <text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      TAMILNADU
    </textPath>
  </text>

  <!-- Central Industrial Road / Pylon (Highway Motif) -->
  <!-- Yellow Highway / Pylon Base Shape -->
  <path d="M 94,48 L 106,48 L 118,124 L 82,124 Z" fill="url(#sidcoGold)" stroke="#0f2e5a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Highway Lane Dividers / Pylon Ladder Rungs (White) -->
  <line x1="100" y1="52" x2="100" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="66" x2="100" y2="76" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="82" x2="100" y2="94" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="100" y2="114" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Cross struts / Industrial Grid on Pylon -->
  <line x1="93" y1="62" x2="107" y2="62" stroke="#0f2e5a" stroke-width="1.8"/>
  <line x1="89" y1="80" x2="111" y2="80" stroke="#0f2e5a" stroke-width="2"/>
  <line x1="85" y1="100" x2="115" y2="100" stroke="#0f2e5a" stroke-width="2.2"/>

  <!-- Golden Beacon Tip on Top -->
  <polygon points="100,42 93,48 107,48" fill="#facc15" stroke="#0f2e5a" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="100" cy="41" r="3" fill="#ffffff"/>

  <!-- Bottom Yellow Banner Box for SIDCO -->
  <path d="M 64,124 L 136,124 L 130,154 L 70,154 Z" fill="url(#sidcoGold)" stroke="#0f2e5a" stroke-width="3" stroke-linejoin="round"/>

  <!-- "SIDCO" Text in Yellow Banner -->
  <text x="100" y="146" text-anchor="middle" fill="#0f2e5a" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="21" letter-spacing="1">
    SIDCO
  </text>
</svg>
